name: 174177 - Neo4j ERP Tutorial

on:
  push:
    branches:
      - feature/174177
    paths:
      - "src/neo4j_174177.py"
      - ".github/workflows/174177_neo4j.yml"
  workflow_dispatch:
    inputs:
      order_quantity:
        description: "Cantidad de Gaming PCs a fabricar"
        required: true
        default: "30"

jobs:
  run-neo4j-174177:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/password
        ports:
          - 7474:7474
          - 7687:7687

    env:
      NEO4J_HOST: localhost
      NEO4J_PORT: 7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      ORDER_QUANTITY: ${{ github.event.inputs.order_quantity || '30' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait For Neo4j
        run: |
          python - <<'PY'
          import time
          from neo4j import GraphDatabase

          for attempt in range(1, 31):
              try:
                  with GraphDatabase.driver("bolt://localhost:7687", auth=("neo4j", "password")) as driver:
                      driver.verify_connectivity()
                  print("Neo4j listo.")
                  break
              except Exception:
                  print(f"Esperando a Neo4j ({attempt}/30)...")
                  time.sleep(2)
          else:
              raise RuntimeError("Neo4j no respondio a tiempo.")
          PY

      - name: Run Neo4j ERP Script
        run: python src/neo4j_174177.py

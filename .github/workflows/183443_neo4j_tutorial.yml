
name: 183443-Neo4j

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: erpdb
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erpdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/password
        ports:
          - 7474:7474
          - 7687:7687

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: erpdb
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp

      MONGO_HOST: localhost
      MONGO_PORT: 27017

      NEO4J_HOST: localhost
      NEO4J_PORT: 7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      NEO4J_URI: bolt://localhost:7687

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install neo4j
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Show Docker Services
        run: |
          docker ps -a

      - name: Test Ports
        run: |
          nc -zv localhost 5432 || true
          nc -zv localhost 27017 || true
          nc -zv localhost 7687 || true

      - name: Wait For Services
        run: |
          for port in 5432 27017 7687; do
            echo "Waiting for port $port..."
            timeout 90 bash -c \
              "until nc -z localhost $port; do sleep 2; done"
          done
          echo "All services are available."

      - name: Create Database Schema
        run: |
          if [ -f src/create_schema.py ]; then
            python src/create_schema.py
          else
            echo "create_schema.py not found. Skipping."
          fi

      - name: Load Master Data
        run: |
          if [ -f src/seed_data.py ]; then
            python src/seed_data.py
          else
            echo "seed_data.py not found. Skipping."
          fi

      - name: Create Neo4j Graph
        run: |
          if [ -f src/create_graph.py ]; then
            python src/create_graph.py
          else
            echo "create_graph.py not found."
            echo "Add your Neo4j graph creation script to src/create_graph.py."
          fi

      - name: Verify Neo4j Connection
        run: |
          python -c "
          from neo4j import GraphDatabase
          driver = GraphDatabase.driver(
              'bolt://localhost:7687',
              auth=('neo4j', 'password')
          )
          with driver.session() as session:
              result = session.run('RETURN 1 AS test')
              print('Neo4j connection successful:', result.single()['test'])
          driver.close()
          "

      - name: Set Python Path
        run: |
          echo "PYTHONPATH=${GITHUB_WORKSPACE}" >> $GITHUB_ENV

      - name: Run Unit Tests
        run: |
          if [ -d tests ]; then
            pytest -v
          else
            echo "Tests directory not found. Skipping."
          fi

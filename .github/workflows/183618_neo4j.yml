name: Crear Grafo AR&AP en Neo4j
on:
  push:
    branches:
      - "feature/*"
      - "183618/*"
  workflow_dispatch:

jobs:
  crear-grafo-arap:
    runs-on: ubuntu-latest
    
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/password
        ports:
          - 7687:7687

    env:
      NEO4J_HOST: localhost
      NEO4J_PORT: 7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar libreria de Neo4j
        run: |
          python -m pip install --upgrade pip
          pip install neo4j

      - name: Esperar a que Neo4j este listo
        run: sleep 15

      - name: Ejecutar el script de AR&AP para crear el grafo
        run: |
          # Nota que aquí mandamos a llamar tu script desde tu carpeta
          python AR\&AP/neo4j_grafo.py
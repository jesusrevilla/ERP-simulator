# Miriam - 183800
# Valida que los documentos A/R-A/P de PostgreSQL se sincronicen bien con Neo4j
name: 183800 - Sincronizacion PostgreSQL a Neo4j (Knowledge Graph A/R-A/P)

on:
  push:
    branches:
      - feature/183800
  workflow_dispatch:

jobs:
  sync-postgres-neo4j:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: erpdb
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erpdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/password
        ports:
          - 7474:7474
          - 7687:7687

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: erpdb
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      PGPASSWORD: erp
      NEO4J_HOST: localhost
      NEO4J_PORT: 7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Esperar a que Neo4j esté listo
        run: |
          python - <<'PY'
          import time
          from neo4j import GraphDatabase

          for attempt in range(1, 31):
              try:
                  with GraphDatabase.driver("bolt://localhost:7687", auth=("neo4j", "password")) as driver:
                      driver.verify_connectivity()
                  print("Neo4j listo.")
                  break
              except Exception:
                  print(f"Esperando a Neo4j ({attempt}/30)...")
                  time.sleep(2)
          else:
              raise RuntimeError("Neo4j no respondio a tiempo.")
          PY

      - name: Correr pruebas
        run: python -m pytest "AR&AP/183800" -v

      - name: Cargar tablas y datos de prueba en PostgreSQL
        run: |
          # Carga las tablas de mis compañeros (Azul, Alexis, Diego) para que mi sincronizador tenga datos que leer
          for f in Tablas-Alexis.sql tablas.sql azul_ventas.sql miriam_contabilidad.sql; do
            psql -h localhost -U erp -d erpdb -v ON_ERROR_STOP=0 -f "AR&AP/$f"
          done
          psql -h localhost -U erp -d erpdb -v ON_ERROR_STOP=1 -f "AR&AP/183800/seed_arap_183800.sql"

      - name: Sincronizar PostgreSQL con Neo4j (primera vez)
        run: python "AR&AP/183800/sync_postgres_neo4j.py"

      - name: Sincronizar otra vez (no debe crear nada nuevo)
        run: |
          python "AR&AP/183800/sync_postgres_neo4j.py" | tee segunda_corrida.log
          grep -q "Creados en esta corrida: 0 nodos, 0 relaciones" segunda_corrida.log

      - name: Ejecutar consultas Cypher
        run: python "AR&AP/183800/ejecutar_consultas.py"

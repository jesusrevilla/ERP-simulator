name: 182078-Neo4j
on:
  workflow_dispatch:
    inputs:
      order_quantity:
        description: "Cantidad de Gaming PCs a fabricar"
        required: true
        default: "30"
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: erpdb
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/password

        ports:
          - 7474:7474
          - 7687:7687

    env:
      ORDER_QUANTITY: ${{ github.event.inputs.order_quantity }}
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: erpdb
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp

      MONGO_HOST: localhost
      MONGO_PORT: 27017

      NEO4J_HOST: localhost
      NEO4J_PORT: 7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show Docker Services
        run: |
          docker ps -a    

      - name: Test Ports
        run: |
          nc -zv localhost 5432 || true
          nc -zv localhost 27017 || true
          nc -zv localhost 7687 || true
    
      - name: Wait For Services
        run: |
          python src/wait_for_services.py

      - name: Create Database Schema
        run: |
          python src/create_schema.py

      - name: Load Master Data
        run: |
          python src/seed_data.py

      - name: Run MRP Validation
        run: |
          python src/check_shortages.py

      - name: Set Python Path
        run: |
          echo "PYTHONPATH=${GITHUB_WORKSPACE}" >> $GITHUB_ENV          

      - name: Run Unit Tests
        run: |
          pytest -v

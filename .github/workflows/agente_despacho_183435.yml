name: 183435 - Agente de despacho e integridad (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-dispatch-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: password
      MONGO_URI: mongodb://localhost:27017
      MONGO_DATABASE: erpdb
      MONGO_COLLECTION: integridad_transacciones

    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install neo4j pymongo

      - name: Cargar JSON de integridad en MongoDB
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from pymongo import MongoClient

          folder = Path("Integridad_de_las_transacciones")
          json_files = sorted(folder.glob("*.json"))
          if not json_files:
              raise SystemExit(f"No se encontraron JSON en {folder}")

          def collect_hierarchical_events(node, path=()):
              found = []
              if isinstance(node, dict):
                  if "id" in node and "evento" in node:
                      found.append((node, path))
                  else:
                      for key, value in node.items():
                          found.extend(collect_hierarchical_events(value, path + (key,)))
              elif isinstance(node, list):
                  for value in node:
                      found.extend(collect_hierarchical_events(value, path))
              return found

          def extract_records(filename, data):
              if isinstance(data.get("event_sequence"), list):
                  return [(event, None) for event in data["event_sequence"]]

              module = data.get("mrp_transaction_integrity_module", {})
              if isinstance(module.get("events"), list):
                  return [(event, None) for event in module["events"]]

              if isinstance(data.get("TransactionHeader"), dict):
                  return [(data, None)]

              hierarchy_events = collect_hierarchical_events(data.get("jerarquia", {}))
              if hierarchy_events:
                  return hierarchy_events

              raise ValueError(f"No se reconoció una estructura de eventos en {filename}")

          client = MongoClient(os.environ["MONGO_URI"], serverSelectionTimeoutMS=10000)
          client.admin.command("ping")
          database = client[os.environ["MONGO_DATABASE"]]
          collection_name = os.environ["MONGO_COLLECTION"]
          if collection_name not in database.list_collection_names():
              database.create_collection(collection_name)
          collection = database[collection_name]
          collection.create_index([("topic", 1), ("source_file", 1)])

          metadata_keys = (
              "modelo", "proyecto", "estandar_referencia", "company", "product",
              "standard", "domain", "standard_alignment", "subsystem",
              "transaction_integrity_pattern", "description",
          )
          loaded = 0
          for path in json_files:
              data = json.loads(path.read_text(encoding="utf-8"))
              source_context = {key: data[key] for key in metadata_keys if key in data}
              records = extract_records(path.name, data)
              for index, (event, hierarchy_path) in enumerate(records, start=1):
                  transaction_header = event.get("TransactionHeader", {})
                  event_id = (
                      event.get("event_id") or event.get("id")
                      or transaction_header.get("TransactionID")
                      or f"record-{index}"
                  )
                  event_type = (
                      event.get("event_name") or event.get("event_type")
                      or event.get("evento") or transaction_header.get("TransactionType")
                      or "INTEGRITY_EVENT"
                  )
                  document = {
                      "_id": f"{path.name}:{event_id}",
                      "topic": "integridad_de_las_transacciones",
                      "source_file": path.name,
                      "event_id": str(event_id),
                      "event_type": event_type,
                      "source_context": source_context,
                      "event_data": event,
                  }
                  if hierarchy_path:
                      document["hierarchy_path"] = list(hierarchy_path)
                  collection.replace_one({"_id": document["_id"]}, document, upsert=True)
                  loaded += 1
              print(f"{path.name}: {len(records)} registros/eventos procesados")

          print(
              f"MongoDB: {loaded} registros cargados/actualizados en "
              f"{os.environ['MONGO_DATABASE']}.{collection_name}"
          )
          client.close()
          PY

      - name: Esperar a Neo4j
        run: |
          python - <<'PY'
          import os
          import time
          from neo4j import GraphDatabase

          auth = (os.environ["NEO4J_USERNAME"], os.environ["NEO4J_PASSWORD"])
          for attempt in range(30):
              try:
                  with GraphDatabase.driver(os.environ["NEO4J_URI"], auth=auth) as driver:
                      driver.verify_connectivity()
                  print("Neo4j local está disponible.")
                  break
              except Exception as error:
                  print(f"Intento {attempt + 1}/30: Neo4j aún inicia ({error})")
                  time.sleep(2)
          else:
              raise SystemExit("Neo4j no estuvo disponible a tiempo.")
          PY

      - name: Ejecutar agente sobre los eventos RF-07 y RF-08
        run: python Recibos_y_entregas/agente_despacho_grafo_183435.py
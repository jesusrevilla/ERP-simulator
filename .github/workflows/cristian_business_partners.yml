name: Cristian - Business Partners y Neo4j

on:
  push:
    branches:
      - feature/cristian-business-partners
    paths:
      - "Business-Partner/CristianGodinez_*"
      - "src/business_partner_events_cristian.py"
      - "src/neo4j_business_partners_cristian.py"
      - "tests/test_business_partner_events_cristian.py"
      - "tests/test_business_partner_graph_cristian.py"
      - ".github/workflows/cristian_business_partners.yml"
  workflow_dispatch:

jobs:
  business-partners:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/password
        ports:
          - 7687:7687

    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: password
      NEO4J_DATABASE: neo4j

    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar paquetes
        run: python -m pip install -r requirements.txt

      - name: Ejecutar pruebas unitarias del modulo
        run: |
          python -m pytest tests/test_business_partner_events_cristian.py tests/test_business_partner_graph_cristian.py -q

      - name: Validar eventos BP sin servidor
        run: |
          python -m src.business_partner_events_cristian
          python -m src.neo4j_business_partners_cristian --offline

      - name: Esperar servicio Neo4j
        run: |
          python - <<'PY'
          import time
          from neo4j import GraphDatabase
          for attempt in range(60):
              try:
                  with GraphDatabase.driver(
                      "bolt://localhost:7687", auth=("neo4j", "password")
                  ) as driver:
                      driver.verify_connectivity()
                  print("Neo4j disponible")
                  break
              except Exception:
                  time.sleep(2)
          else:
              raise RuntimeError("Neo4j no respondió")
          PY

      - name: Cargar Business Partners y comprobar MERGE
        run: python -m src.neo4j_business_partners_cristian

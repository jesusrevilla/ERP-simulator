name: Flujo Integridad de las transacciones (184661)

on:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Llamar a ci.yml
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo ${{ github.repository }} --ref ${{ github.ref_name }} -f order_quantity=30

  agente:
    needs: ci
    uses: ./.github/workflows/agente_transacciones_184661.yml

name: Carga MongoDB BOM - 184149

on:
  push:
    branches: [ "development", "feature/184149" ]
  pull_request:
    branches: [ "development" ]
  workflow_dispatch:

jobs:
  cargar-mongo:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "echo 'db.runCommand(\"ping\").ok' | mongosh localhost:27017/test --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pymongo

      - name: Ejecutar script de carga BOM
        run: |
          python cargar_bom.py

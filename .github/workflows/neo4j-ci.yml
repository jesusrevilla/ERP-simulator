name: Neo4j Tutorial Pipeline CI

on:
  push:
    branches: [ "feature/185003", "development", "main" ]
  pull_request:
    branches: [ "development", "main" ]

jobs:
  run-neo4j-tutorial:
    runs-on: ubuntu-latest

    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/tutorial-password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p tutorial-password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: tutorial-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned tutorial dependencies
        run: python -m pip install -r tutorial_175932/requirements.txt
      - name: Run ingestion and validated analysis queries
        run: python tutorial_175932/run_tutorial.py
      - name: Preserve execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neo4j-tutorial-results
          path: tutorial_175932/evidence/

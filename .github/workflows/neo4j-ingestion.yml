
name: Neo4j Football Data Ingestion

on:
  workflow_dispatch:

  push:
    branches:
      - creature/184204
    paths:
      - "neo4j_tutorial/ingest_football_data.py"
      - "neo4j_tutorial/requirements.txt"
      - ".github/workflows/neo4j-ingestion.yml"

jobs:
  ingest-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r neo4j_tutorial/requirements.txt

      - name: Import football data into Neo4j
        env:
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        run: |
          python neo4j_tutorial/ingest_football_data.py

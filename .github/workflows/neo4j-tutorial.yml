name: Neo4j Tutorial

on:
  push:
    branches:
      - feature/183435
  workflow_dispatch:
    inputs:
      order_quantity:
        description: "Cantidad de Gaming PCs a fabricar"
        required: true
        default: "30"

jobs:
  neo4j-tutorial:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/password
        ports:
          - 7474:7474
          - 7687:7687

    env:
      NEO4J_HOST: localhost
      NEO4J_PORT: 7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      ORDER_QUANTITY: ${{ github.event.inputs.order_quantity || '30' }}

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install neo4j

      - name: Esperar a que Neo4j esté disponible
        run: |
          python - <<'PY'
          import os
          import time
          from neo4j import GraphDatabase

          uri = f"bolt://{os.environ['NEO4J_HOST']}:{os.environ['NEO4J_PORT']}"
          auth = (os.environ["NEO4J_USER"], os.environ["NEO4J_PASSWORD"])

          for attempt in range(30):
              try:
                  with GraphDatabase.driver(uri, auth=auth) as driver:
                      driver.verify_connectivity()
                  print("Neo4j está listo.")
                  break
              except Exception as error:
                  print(f"Intento {attempt + 1}/30: Neo4j aún inicia ({error}).")
                  time.sleep(2)
          else:
              raise SystemExit("Neo4j no estuvo disponible a tiempo.")
          PY

      - name: Ejecutar el tutorial de Neo4j
        run: python src/neo4j_tutorial_erp.py

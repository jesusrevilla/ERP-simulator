name: Neo4j ERP Workflow

on:
  push:
    branches:
      - feature/185122
  workflow_dispatch:
    inputs:
      order_quantity:
        description: "Número de Gaming PCs solicitadas para producción"
        required: true
        default: "30"

jobs:
  run-neo4j:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      database:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/password
        ports:
          - 7474:7474
          - 7687:7687

    env:
      NEO4J_HOST: localhost
      NEO4J_PORT: 7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      ORDER_QUANTITY: ${{ github.event.inputs.order_quantity || '30' }}

    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      - name: Preparar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar librerías necesarias
        run: |
          python -m pip install --upgrade pip
          pip install neo4j

      - name: Comprobar conexión con Neo4j
        run: |
          python - <<'PY'
          import os
          import time
          from neo4j import GraphDatabase

          host = os.getenv("NEO4J_HOST")
          port = os.getenv("NEO4J_PORT")
          uri = f"bolt://{host}:{port}"
          credentials = (
              os.getenv("NEO4J_USER"),
              os.getenv("NEO4J_PASSWORD")
          )

          connected = False

          for attempt in range(1, 31):
              try:
                  driver = GraphDatabase.driver(uri, auth=credentials)
                  driver.verify_connectivity()
                  driver.close()

                  print("Conexión con Neo4j establecida correctamente.")
                  connected = True
                  break

              except Exception as error:
                  print(f"Intento {attempt} de 30: esperando a Neo4j...")
                  print(error)
                  time.sleep(2)

          if not connected:
              raise SystemExit("No fue posible establecer conexión con Neo4j.")
          PY

      - name: Ejecutar proceso de demostración ERP
        run: python src/neo4j_tutorial_erp.py
name: Proyecto Integrador 178084 (BD Cuarentena/RTV + Agente IA ATP/FEFO)

on:
  push:
    branches:
      - feature/178084
  pull_request:
    branches:
      - development
  workflow_dispatch:

jobs:
  validar-proyecto-178084:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: erpdb
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/password
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd="wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: erpdb
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      MONGO_HOST: localhost
      MONGO_PORT: 27017
      MONGO_DB: erpdb
      NEO4J_HOST: localhost
      NEO4J_PORT: 7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait For Databases (PostgreSQL, MongoDB, Neo4j)
        run: |
          python src/wait_for_services.py

      - name: Run DB Pipeline (#305 - PostgreSQL, Neo4j, MongoDB)
        run: |
          python Recibos_y_entregas/178084_cuarentena_rtv/db_pipeline_178084.py

      - name: Run AI Agent (#306 - InventoryFEFOAgent)
        run: |
          python Inventario/178084_agente_atp_fefo/agente_atp_fefo_178084.py

      - name: Run Pytest Suite (BD + IA 178084)
        run: |
          pytest -vv Inventario/178084_agente_atp_fefo/test_proyecto_178084.py
name: Ejecutar Tutorial DataCamp Automático

on:
  push:
    branches: [ "feature/184027" ]

jobs:
  tutorial-neo4j:
    runs-on: ubuntu-latest

    # Levanta una base de datos Neo4j temporal y limpia para el tutorial
    services:
      neo4j:
        image: neo4j:latest
        env:
          NEO4J_AUTH: neo4j/password123
        ports:
          - 7687:7687

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Instalar dependencias del tutorial
      run: |
        python -m pip install --upgrade pip
        pip install neo4j python-dotenv tqdm pandas

    - name: 1. Descargar e Ingestar Datos (Fútbol)
      env:
        NEO4J_URI: neo4j://localhost:7687
        NEO4J_USERNAME: neo4j
        NEO4J_PASSWORD: password123
      run: |
        wget https://raw.githubusercontent.com/BexTuychiev/medium_stories/refs/heads/master/2024/9_september/3_neo4j_python/ingest_football_data.py
        python ingest_football_data.py

    - name: 2. Ejecutar Consulta Cypher del Tutorial
      env:
        NEO4J_URI: neo4j://localhost:7687
        NEO4J_USERNAME: neo4j
        NEO4J_PASSWORD: password123
      run: |
        cat << 'SCRIPT' > tutorial_query.py
        import os
        from neo4j import GraphDatabase
        uri = os.getenv("NEO4J_URI")
        driver = GraphDatabase.driver(uri, auth=(os.getenv("NEO4J_USERNAME"), os.getenv("NEO4J_PASSWORD")))
        
        query = """
        MATCH (p:Player)-[s:SCORED_IN]->(m:Match)-[PART_OF]->(t:Tournament) 
        WHERE t.name = 'FIFA World Cup' AND s.minute > 80 AND s.own_goal = True 
        RETURN p.name AS Player, m.date AS Date, s.minute AS Minute LIMIT 5
        """
        
        with driver.session() as session:
            print("--- Resultados de la Consulta Automática ---")
            for record in session.run(query):
                print(f"Jugador: {record['Player']}, Fecha: {record['Date']}, Minuto: {record['Minute']}")
        SCRIPT
        python tutorial_query.py

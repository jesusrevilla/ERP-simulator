name: Agente Lead Time 179091

on:
  push:
    branches:
      - feature/179091
    paths:
      - 'LeadTime/agente_leadtime_179091/**'
      - '.github/workflows/agente_leadtime_179091.yml'
  workflow_dispatch:

jobs:
  ejecutar-agente-leadtime:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: erp_leadtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongodb:
        image: mongo:6
        ports:
          - 27017:27017

      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/password123
        ports:
          - 7474:7474
          - 7687:7687

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary pymongo neo4j

      - name: Ejecutar Agente de Riesgo de Lead Time
        env:
          PG_HOST: localhost
          PG_PORT: 5432
          PG_DB: erp_leadtime
          PG_USER: postgres
          PG_PASSWORD: postgres
          MONGO_URI: mongodb://localhost:27017/
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: password123
        run: python LeadTime/agente_leadtime_179091/agente_leadtime.py

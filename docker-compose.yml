version: '3.8'

services:
  neo4j:
    image: neo4j:5.22-community
    container_name: neo4j_tutorial
    ports:
      - "7474:7474" # Interfaz web (HTTP / Neo4j Browser)
      - "7687:7687" # Protocolo Bolt (para código Python/JS/Java)
    environment:
      - NEO4J_AUTH=neo4j/SuperPassword123
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data: